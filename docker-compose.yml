services:
  alkh:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: ${ALKH_IMAGE:-ghcr.io/fengyifan/alertmanager-lark-hook:latest}
    restart: unless-stopped
    ports:
      - "${ALKH_PORT:-8080}:8080"
    environment:
      ALKH_HTTP_ADDR: 0.0.0.0:8080
      ALKH_DATA_DIR: /data
      ALKH_LOG_LEVEL: ${ALKH_LOG_LEVEL:-info}
      ALKH_LOG_JSON: ${ALKH_LOG_JSON:-false}
      # 首次启动创建管理员；不设置则随机生成并打印到容器日志
      ALKH_ADMIN_USERNAME: ${ALKH_ADMIN_USERNAME:-admin}
      ALKH_ADMIN_PASSWORD: ${ALKH_ADMIN_PASSWORD:-}
      # 加密飞书 app_secret 的主密钥（64 位 hex 或 base64，32 字节）。
      # 不设置时会在 /data/master.key 自动生成——生产环境建议显式提供并妥善备份。
      ALKH_MASTER_KEY: ${ALKH_MASTER_KEY:-}
      # 生成 AlertManager 接收地址用的对外基址，例如 https://alkh.example.com
      ALKH_PUBLIC_BASE_URL: ${ALKH_PUBLIC_BASE_URL:-http://localhost:8080}
      ALKH_LARK_BASE_URL: ${ALKH_LARK_BASE_URL:-https://open.feishu.cn}
      # 通过 HTTPS 反代访问时置为 true，会话 Cookie 会带 Secure
      ALKH_COOKIE_SECURE: ${ALKH_COOKIE_SECURE:-false}
    volumes:
      - alkh-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/alkh", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # 可选：本地联调用的 AlertManager（make up 时加 --profile demo）
  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: ["demo"]
    restart: unless-stopped
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./deploy/alertmanager.example.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--web.external-url=http://localhost:9093"

volumes:
  alkh-data:
