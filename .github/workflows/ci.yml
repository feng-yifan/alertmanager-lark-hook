name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust（fmt / clippy / test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy（警告视为错误）
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 内含 15 个端到端测试：真实 Axum HTTP 栈 + 内存 SQLite + Fake 飞书网关，
      # 不需要任何真实凭据或外部服务。
      - name: 测试
        run: cargo test --workspace

  msrv:
    name: MSRV（Cargo.toml 声明的下限）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 用 Cargo.toml 声明的 rust-version 构建一次。
      # 目的：`deploy/Dockerfile` 的基础镜像版本与锁定依赖要求的 MSRV 一旦脱节，
      # 只有真正构建镜像时才会失败（而 rust job 用的是 stable，永远绿）。
      # 这个 job 让漂移在 PR 阶段就暴露。
      - name: 读取声明的 MSRV
        id: msrv
        run: |
          v=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          test -n "$v" || { echo "Cargo.toml 未声明 rust-version" >&2; exit 1; }
          echo "MSRV = $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: cargo check（MSRV 工具链）
        run: cargo check --workspace --all-targets

  web:
    name: Web（tsc / build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm exec tsc --noEmit

      - name: 构建
        run: pnpm build
