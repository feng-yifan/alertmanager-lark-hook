name: QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 release.yml 共用同一份 buildx 缓存，tag 发布时的镜像构建可以直接命中 PR / main 的层
  CACHE_SCOPE: alkh

jobs:
  rust:
    name: Rust（fmt / clippy / test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy（警告视为错误）
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 内含 15 个端到端测试：真实 Axum HTTP 栈 + 内存 SQLite + Fake 飞书网关，
      # 不需要任何真实凭据或外部服务。
      - name: 测试
        run: cargo test --workspace

  msrv:
    name: MSRV（Cargo.toml 声明的下限）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 用 Cargo.toml 声明的 rust-version 构建一次。
      # 目的：`deploy/Dockerfile` 的基础镜像版本与锁定依赖要求的 MSRV 一旦脱节，
      # 只有真正构建镜像时才会失败（而 rust job 用的是 stable，永远绿）。
      # 这个 job 让漂移在 PR 阶段就暴露。
      - name: 读取声明的 MSRV
        id: msrv
        run: |
          v=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          test -n "$v" || { echo "Cargo.toml 未声明 rust-version" >&2; exit 1; }
          echo "MSRV = $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: cargo check（MSRV 工具链）
        run: cargo check --workspace --all-targets

  web:
    name: Web（tsc / build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm exec tsc --noEmit

      - name: 构建
        run: pnpm build

  # 只构建、不推送。真正推送镜像只发生在 tag 上（release.yml），但 Dockerfile /
  # 桩代码预热这类「只有构建时才暴露」的问题必须在 PR 阶段就拦下来。
  # 2026-10-13 那次 Publish image 失败就是这个缺口导致的：此前没有任何 job
  # 真正执行过 deploy/Dockerfile。
  docker:
    name: 镜像可构建性（构建不推送）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建镜像（不推送）
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}
